name: Xiaomi Stone Kernel Builder

on:
  workflow_dispatch:
    inputs:
      enable_ksu:
        description: 'Enable KernelSU (KSU)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Build Kernel
        uses: boonkhengs-debug/kernel_build_action@main
        id: build_kernel
        with:
          kernel-url: https://github.com/boonkhengs-debug/eclipse_kernel_xiaomi_stone
          kernel-branch: 16
          config: stone_defconfig
          arch: arm64
          android-version: 12
          aosp-gcc: true
          aosp-clang: true
          aosp-clang-version: r383902
          ksu: ${{ github.event.inputs.enable_ksu }}
          ksu-version: 'main'
          disable-lto: true
          anykernel3: true
          # Required for modern Xiaomi Qualcomm devices
          # extra-make-args: '["LLVM=1","LLVM_IAS=1"]'

      - name: Package, Rename and Tag
        run: |
          # 0. Enter the directory where the 18 files were found
          cd build/

          # 1. Calculate the date for the release body
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M')
          echo "BODY_DATE=$BUILD_DATE" >> $GITHUB_ENV
          
          # 2. Generate naming variables
          TIMESTAMP=$(date +%Y%m%d-%H%M)
          # Logical check for KSU tag
          if [[ "${{ github.event.inputs.enable_ksu }}" == "true" ]]; then
            TAG="KSU"
          else
            TAG="NoKSU"
          fi
          
          FILENAME="Stone-Kernel-${TAG}-${TIMESTAMP}.zip"
          
          # 3. Create the flashable AnyKernel3 ZIP (zipping from INSIDE the folder)
          zip -r9 "../$FILENAME" *
          
          # 4. Export variables for the next step
          cd ..
          echo "RELEASE_TAG=Kernel_${TAG}_${TIMESTAMP}" >> $GITHUB_ENV
          echo "FINAL_ZIP=$FILENAME" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: env.FINAL_ZIP != ''
        with:
          files: ${{ env.FINAL_ZIP }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: Stone Kernel (${{ env.RELEASE_TAG }})
          body: |
            Build successfully completed.
            
            **KSU Enabled:** ${{ github.event.inputs.enable_ksu }}
            **Build Date:** ${{ env.BODY_DATE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
